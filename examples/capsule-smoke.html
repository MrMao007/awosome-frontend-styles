<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capsule Skill Smoke Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700;6..96,800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5F5F0;--ink:#1A1A1A;--outline:#1E1E1E;--lime:#C4D94E;--coral:#E85D4E;--yellow:#F2D160;--sky:#8BB4F7;--lavender:#C5B5E0;--shadow:rgba(26,26,26,.08)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Space Grotesk",sans-serif;background-color:var(--cream);background-image:radial-gradient(ellipse at 12% 8%,rgba(229,93,78,.10),transparent 45%),radial-gradient(ellipse at 88% 22%,rgba(139,180,247,.12),transparent 42%),radial-gradient(ellipse at 70% 95%,rgba(196,217,78,.10),transparent 45%)}
main{min-height:100vh;display:grid;place-items:center;padding:48px 24px;overflow:hidden;position:relative;text-align:center}.pill{position:absolute;padding:.5rem 1.2rem;border:2px solid var(--outline);border-radius:9999px;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:var(--sky)}.p1{top:10%;left:8%;transform:rotate(-8deg)}.p2{top:17%;right:7%;background:var(--lavender);transform:rotate(9deg)}.p3{bottom:13%;left:12%;background:var(--lime);transform:rotate(5deg)}.p4{bottom:9%;right:10%;background:var(--coral);transform:rotate(-7deg)}
.content{position:relative;z-index:2;max-width:980px}.tag{display:inline-flex;padding:1rem 2.6rem;border:2px solid var(--outline);border-radius:9999px;background:var(--yellow);box-shadow:6px 6px 0 var(--shadow);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase}h1{margin:38px 0 0;font-family:"Bodoni Moda",serif;font-weight:800;font-size:clamp(72px,13vw,180px);line-height:.88;letter-spacing:-.03em}h1 em{color:var(--coral);font-weight:800}.rule{width:96px;height:5px;margin:36px auto 0;border-radius:9999px;background:var(--coral)}p{max-width:620px;margin:28px auto 0;font-size:17px;line-height:1.6}.cta{display:inline-flex;margin-top:30px;padding:.8rem 1.6rem;border:2px solid var(--outline);border-radius:9999px;background:white;box-shadow:8px 8px 0 var(--shadow);font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:inherit;text-decoration:none}.cta:focus-visible{outline:3px solid var(--ink);outline-offset:4px}@media(max-width:600px){.pill{font-size:10px}.p2,.p3{display:none}h1{font-size:clamp(60px,22vw,92px)}.tag{font-size:11px;padding:.8rem 1.5rem}}
</style>
</head>
<body><main><span class="pill p1" aria-hidden="true">Playful</span><span class="pill p2" aria-hidden="true">Editorial</span><span class="pill p3" aria-hidden="true">Candy</span><span class="pill p4" aria-hidden="true">Rounded</span><section class="content"><span class="tag">Capsule style verified</span><h1>Ideas in <em>motion.</em></h1><div class="rule"></div><p>A smoke test generated from the installed skill’s Capsule reference: cream canvas, outlined pills, Bodoni display, Space Grotesk support, candy fills, and subtle hard-offset lift.</p><a class="cta" href="#">Start creating</a></section></main></body>
</html>
