name: Validate Agent Skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalogue, references and examples
        run: node scripts/validate.cjs
      - name: Discover skill
        run: npx --yes skills@1.7.1 add . --list
